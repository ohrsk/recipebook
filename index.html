<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>さきのレシピ帖</title>
<meta name="theme-color" content="#eef1ec" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#141a1d" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="レシピ帖">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap">
<style>
html{-webkit-text-size-adjust:100%}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0}
img{max-width:100%}
[hidden]{display:none!important}

/* Layout: one narrow column (max 560px) like a kitchen notebook propped on the counter; list → detail → edit as stacked views */
:root{
  --bg:#eef1ec;          /* pale sage, like a cutting board wash */
  --surface:#ffffff;
  --ink:#1f2a33;         /* deep indigo ink */
  --muted:#5f6b70;
  --line:#d7ddd5;
  --accent:#c98a10;      /* saffron / mustard */
  --accent-ink:#1f2a33;
  --accent-soft:#f6e7c4;
  --herb:#3e7a5a;        /* favorites / done */
  --danger:#b3392f;
  --shadow:0 1px 2px rgba(31,42,51,.06),0 4px 14px rgba(31,42,51,.06);
  --f-display:"Zen Maru Gothic","Hiragino Maru Gothic ProN","Hiragino Sans",sans-serif;
  --f-body:"Zen Kaku Gothic New","Hiragino Sans","Noto Sans JP","Yu Gothic",sans-serif;
  --r:14px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#141a1d;--surface:#1d2529;--ink:#e8ece9;--muted:#9aa6a8;--line:#2f3a3f;
  --accent:#e2a93a;--accent-ink:#141a1d;--accent-soft:#3a3020;--herb:#6cbf91;--danger:#e8776c;
  --shadow:0 1px 2px rgba(0,0,0,.3);color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#141a1d;--surface:#1d2529;--ink:#e8ece9;--muted:#9aa6a8;--line:#2f3a3f;
  --accent:#e2a93a;--accent-ink:#141a1d;--accent-soft:#3a3020;--herb:#6cbf91;--danger:#e8776c;
  --shadow:0 1px 2px rgba(0,0,0,.3);color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.7;-webkit-font-smoothing:antialiased}
.wrap{max-width:560px;margin:0 auto;padding-inline:16px;padding-block:0 96px}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;line-height:1.35}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:14px 10px;display:grid;gap:10px}
.brand{display:flex;align-items:baseline;justify-content:space-between;gap:12px}
.brand h1{font-size:1.45rem;letter-spacing:.02em}
.count{font-size:.8rem;color:var(--muted);font-variant-numeric:tabular-nums}
.search{position:relative}
.search input{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:11px 16px 11px 40px;font-size:16px}
.search svg{position:absolute;left:14px;top:50%;transform:translateY(-50%);width:18px;height:18px;stroke:var(--muted)}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 12px;font-size:.85rem;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chip.fav[aria-pressed="true"]{background:var(--herb);border-color:var(--herb);color:#fff}
.row-tools{display:flex;justify-content:space-between;align-items:center;gap:8px}
.row-tools select{border:none;background:transparent;color:var(--muted);font-size:.85rem;padding:2px 0}

/* list */
.list{display:grid;gap:10px;margin-top:6px}
.card{display:grid;grid-template-columns:84px 1fr;gap:12px;align-items:center;background:var(--surface);border-radius:var(--r);padding:10px;box-shadow:var(--shadow);text-align:left;border:none;width:100%}
.thumb{width:84px;height:84px;border-radius:10px;background:var(--accent-soft);object-fit:cover;display:grid;place-items:center;font-family:var(--f-display);font-size:1.7rem;color:var(--accent);overflow:hidden}
.thumb img{width:100%;height:100%;object-fit:cover}
.card-body{min-width:0;display:grid;gap:2px}
.card h2{font-size:1.02rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.meta{display:flex;flex-wrap:wrap;gap:4px 10px;font-size:.8rem;color:var(--muted);font-variant-numeric:tabular-nums}
.tags{display:flex;flex-wrap:wrap;gap:4px}
.tag{font-size:.72rem;background:var(--accent-soft);color:var(--ink);border-radius:6px;padding:0 7px;line-height:1.7}
.star{color:var(--herb)}
.sample{font-size:.68rem;border:1px dashed var(--muted);color:var(--muted);border-radius:6px;padding:0 6px}

.empty{background:var(--surface);border-radius:var(--r);padding:28px 20px;text-align:center;color:var(--muted);display:grid;gap:12px;justify-items:center;margin-top:12px}
.empty h2{color:var(--ink);font-size:1.1rem}
.banner{background:var(--accent-soft);border-radius:10px;padding:10px 14px;font-size:.85rem;margin-top:8px}

/* FAB */
.fab{position:fixed;right:max(16px,calc(50% - 264px));bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--accent);color:var(--accent-ink);border:none;border-radius:999px;padding:14px 22px;font-weight:700;box-shadow:0 6px 18px rgba(0,0,0,.18);display:flex;gap:6px;align-items:center;font-family:var(--f-display);z-index:6}

/* buttons */
.btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:9px 16px;font-weight:500}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:700}
.btn.ghost{background:transparent;border-color:transparent;color:var(--muted)}
.btn.danger{color:var(--danger);border-color:var(--danger);background:transparent}
.icon-btn{border:none;background:transparent;padding:8px;border-radius:10px;display:inline-flex;align-items:center;gap:4px;color:var(--ink)}

/* detail */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);display:flex;justify-content:space-between;align-items:center;padding-block:10px;gap:8px}
.bar-actions{display:flex;gap:2px}
.hero{width:100%;aspect-ratio:4/3;max-width:100%;border-radius:var(--r);object-fit:cover;background:var(--accent-soft);display:block}
.detail{display:grid;gap:18px}
.detail h1{font-size:1.6rem}
.desc{color:var(--muted);margin:0}
.facts{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.fact{background:var(--surface);border-radius:12px;padding:10px 14px;display:grid}
.fact small{color:var(--muted);font-size:.75rem;letter-spacing:.06em}
.fact b{font-family:var(--f-display);font-size:1.15rem;font-variant-numeric:tabular-nums}
.section{background:var(--surface);border-radius:var(--r);padding:16px;display:grid;gap:10px}
.section h3{font-size:1.05rem;display:flex;justify-content:space-between;align-items:baseline}
.section h3 small{font-family:var(--f-body);font-weight:400;color:var(--muted);font-size:.78rem}
.ing{list-style:none;margin:0;padding:0}
.ing li{display:flex;gap:10px;align-items:baseline;padding:7px 0;border-bottom:1px dotted var(--line)}
.ing li:last-child{border-bottom:none}
.ing label{display:flex;gap:10px;align-items:center;flex:1;min-width:0;cursor:pointer}
.ing input{accent-color:var(--herb);width:18px;height:18px;flex:0 0 auto}
.ing .amt{margin-left:auto;font-variant-numeric:tabular-nums;color:var(--muted);white-space:nowrap}
.ing li.done span{text-decoration:line-through;color:var(--muted)}
.steps{list-style:none;margin:0;padding:0;display:grid;gap:10px;counter-reset:s}
.steps li{display:grid;grid-template-columns:30px 1fr;gap:10px;counter-increment:s;padding:6px;border-radius:10px}
.steps li::before{content:counter(s);width:28px;height:28px;border-radius:50%;background:var(--accent-soft);color:var(--ink);display:grid;place-items:center;font-family:var(--f-display);font-weight:700;font-size:.9rem}
.steps li p{margin:0;min-width:0;overflow-wrap:anywhere}
.cooking .steps li{font-size:1.2rem;line-height:1.8}
.cooking .steps li.current{background:var(--accent-soft)}
.cooking .steps li.current::before{background:var(--accent);color:var(--accent-ink)}
.note{white-space:pre-wrap;margin:0}
.del-confirm{display:flex;flex-wrap:wrap;gap:8px;align-items:center;background:var(--surface);border:1px solid var(--danger);border-radius:12px;padding:12px}
.del-confirm p{margin:0;flex:1 1 100%}

/* form */
form{display:grid;gap:16px}
.field{display:grid;gap:6px}
.field label{font-weight:700;font-size:.9rem}
.field .hint{font-size:.75rem;color:var(--muted)}
.field input,.field textarea{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 12px;font-size:16px}
.field textarea{resize:vertical;min-height:110px;line-height:1.7}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.photo-pick{display:grid;gap:8px}
.photo-pick .preview{width:100%;aspect-ratio:4/3;max-width:100%;border-radius:12px;object-fit:cover;background:var(--accent-soft)}
.photo-row{display:flex;gap:8px;flex-wrap:wrap}
.form-actions{display:flex;gap:8px;justify-content:flex-end}
.err{color:var(--danger);font-size:.85rem;margin:0}
.fab-row{position:fixed;right:max(16px,calc(50% - 264px));bottom:calc(20px + env(safe-area-inset-bottom,0px));display:flex;gap:8px;z-index:6}
.fab-row .fab{position:static}
.fab.sub{background:var(--surface);color:var(--ink);border:1px solid var(--line)}
.tabs{display:grid;grid-template-columns:repeat(3,1fr);background:var(--surface);border-radius:12px;padding:4px;gap:4px}
.tabs button{border:none;background:transparent;border-radius:9px;padding:8px 4px;font-weight:500;font-size:.9rem;color:var(--muted)}
.tabs button[aria-selected="true"]{background:var(--ink);color:var(--bg)}
.imp{display:grid;gap:16px}
.imp-lead{color:var(--muted);margin:0;font-size:.9rem}
.drop{border:2px dashed var(--line);border-radius:var(--r);background:var(--surface);padding:24px 16px;text-align:center;display:grid;gap:8px;justify-items:center;color:var(--muted)}
.drop.over{border-color:var(--accent);background:var(--accent-soft)}
.shots{display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:8px}
.shots figure{margin:0;position:relative;aspect-ratio:1;max-width:100%;border-radius:10px;overflow:hidden;background:var(--accent-soft)}
.shots img{width:100%;height:100%;object-fit:cover}
.shots button{position:absolute;top:4px;right:4px;border:none;border-radius:999px;width:26px;height:26px;background:rgba(0,0,0,.6);color:#fff;font-size:.8rem;line-height:1}
.check{display:flex;gap:8px;align-items:center;font-size:.9rem}
.check input{accent-color:var(--herb);width:18px;height:18px}
.status{display:flex;gap:10px;align-items:center;background:var(--surface);border-radius:12px;padding:12px 14px;font-size:.9rem}
.spin{width:18px;height:18px;border-radius:50%;border:2px solid var(--line);border-top-color:var(--accent);flex:0 0 auto}
@media (prefers-reduced-motion:no-preference){.spin{animation:sp 0.9s linear infinite}}
@keyframes sp{to{transform:rotate(360deg)}}
.fab.sub{background:var(--surface);color:var(--ink);border:1px solid var(--line)}
.urlrow{display:flex;gap:8px}
.urlrow input{flex:1;min-width:0}
.status{display:flex;gap:10px;align-items:center;background:var(--surface);border-radius:12px;padding:12px 14px;font-size:.9rem}
.spin{width:18px;height:18px;border-radius:50%;border:2px solid var(--line);border-top-color:var(--accent);flex:0 0 auto}
@media (prefers-reduced-motion:no-preference){.spin{animation:sp .9s linear infinite}}
@keyframes sp{to{transform:rotate(360deg)}}
.sites{display:flex;flex-wrap:wrap;gap:6px}
.steps-guide{margin:0;padding-left:1.3em;display:grid;gap:6px;font-size:.9rem}
.code{font-family:ui-monospace,Menlo,monospace;font-size:.8rem;background:var(--bg);border-radius:8px;padding:8px 10px;overflow-wrap:anywhere}
.review{background:var(--accent-soft);border-radius:10px;padding:10px 14px;font-size:.85rem;margin:0}
.src{font-size:.85rem;color:var(--muted);overflow-wrap:anywhere}
.src a{color:var(--ink)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:8px 16px;border-radius:999px;font-size:.85rem;z-index:10}
@media (prefers-reduced-motion:no-preference){.card{transition:transform .12s}.card:active{transform:scale(.985)}}

</style>
</head>
<body>
<div class="wrap" id="app"><div class="empty" style="margin-top:40px"><h2>さきのレシピ帖</h2><p>読み込んでいます…</p></div></div>
<div class="toast" id="toast" hidden></div>
<noscript><p style="padding:16px">このアプリを使うにはJavaScriptを有効にしてください。</p></noscript>
<script>
"use strict";
/* ---------- storage (IndexedDB) ---------- */
const DB_NAME="saki-recipe-book",DB_VER=1;
let idb=null;
function openDB(){return new Promise((ok,ng)=>{const r=indexedDB.open(DB_NAME,DB_VER);
  r.onupgradeneeded=()=>{const d=r.result;if(!d.objectStoreNames.contains("recipes"))d.createObjectStore("recipes",{keyPath:"id"});if(!d.objectStoreNames.contains("photos"))d.createObjectStore("photos")};
  r.onsuccess=()=>ok(r.result);r.onerror=()=>ng(r.error)})}
function tx(store,mode,fn){return new Promise((ok,ng)=>{const t=idb.transaction(store,mode);const st=t.objectStore(store);let out;const req=fn(st);if(req)req.onsuccess=()=>{out=req.result};t.oncomplete=()=>ok(out);t.onerror=()=>ng(t.error);t.onabort=()=>ng(t.error)})}
const dbAll=()=>tx("recipes","readonly",s=>s.getAll());
const dbPut=r=>tx("recipes","readwrite",s=>s.put(r));
const dbDel=id=>tx("recipes","readwrite",s=>s.delete(id));
const photoGet=id=>tx("photos","readonly",s=>s.get(id));
const photoPut=(id,b)=>tx("photos","readwrite",s=>s.put(b,id));
const photoDel=id=>tx("photos","readwrite",s=>s.delete(id));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,8);
const lsGet=k=>{try{return localStorage.getItem(k)}catch(e){return null}};
const lsSet=(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}};

/* ---------- state ---------- */
const S={recipes:[],q:"",tag:null,fav:false,sort:lsGet("sort")||"new",view:"list",id:null,draft:null,photoFile:null,photoPreview:null,confirmDel:false,cooking:false,cur:0,checked:{},saving:false,err:"",bk:{msg:"",err:""},persist:null,imp:{err:""}};
const photoURLs=new Map();
let wake=null;
const $app=document.getElementById("app");
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const safeUrl=u=>{try{const x=new URL(String(u||"").trim());return /^https?:$/.test(x.protocol)?x.href:null}catch(e){return null}};
const hostOf=u=>{try{return new URL(u).hostname.replace(/^www\./,"")}catch(e){return u}};
const photoUrl=r=>r.photo?photoURLs.get(r.photo)||null:null;
const initial=t=>esc((t||"？").trim().charAt(0));
function toast(m){const t=document.getElementById("toast");t.textContent=m;t.hidden=false;clearTimeout(toast._t);toast._t=setTimeout(()=>t.hidden=true,1800)}

async function loadPhoto(id){if(!id||photoURLs.has(id))return;try{const b=await photoGet(id);if(b)photoURLs.set(id,URL.createObjectURL(b))}catch(e){}}
async function reload(){S.recipes=await dbAll();await Promise.all(S.recipes.map(r=>loadPhoto(r.photo)))}

/* ---------- list ---------- */
function allTags(){const m=new Map();S.recipes.forEach(r=>(r.tags||[]).forEach(t=>m.set(t,(m.get(t)||0)+1)));return [...m.entries()].sort((a,b)=>b[1]-a[1]).map(e=>e[0])}
function filtered(){
  const q=S.q.trim().toLowerCase();
  const list=S.recipes.filter(r=>{
    if(S.fav&&!r.favorite)return false;
    if(S.tag&&!(r.tags||[]).includes(S.tag))return false;
    if(!q)return true;
    const hay=[r.title,r.description,...(r.tags||[]),...(r.ingredients||[]).map(i=>i.name)].join(" ").toLowerCase();
    return q.split(/[\s　]+/).every(w=>hay.includes(w));
  });
  const by={new:(a,b)=>(b.updatedAt||0)-(a.updatedAt||0),time:(a,b)=>(a.minutes||999)-(b.minutes||999),name:(a,b)=>(a.title||"").localeCompare(b.title||"","ja")}[S.sort]||(()=>0);
  return list.sort(by);
}
const searchIcon='<svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>';
const gearIcon='<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/></svg>';

function listBody(list){
  if(S.recipes.length===0)return `<div class="empty"><h2>まだレシピがありません</h2><p>右下の「＋ 追加」から、材料と作り方を登録しましょう。写真も付けられます。</p><div style="display:flex;gap:8px;flex-wrap:wrap;justify-content:center"><button class="btn primary" data-act="new">最初のレシピを追加</button><button class="btn" data-act="settings">バックアップから戻す</button></div></div>`;
  if(list.length===0)return `<div class="empty"><h2>見つかりませんでした</h2><p>別のことばや材料名で探してみてください。</p><button class="btn" data-act="clear">条件をクリア</button></div>`;
  return `<div class="list">${list.map(r=>`
    <button class="card" data-open="${esc(r.id)}">
      <div class="thumb">${photoUrl(r)?`<img src="${esc(photoUrl(r))}" alt="" loading="lazy">`:initial(r.title)}</div>
      <div class="card-body">
        <h2>${esc(r.title)}</h2>
        <div class="meta">${r.minutes?`<span>⏱ ${esc(r.minutes)}分</span>`:""}${r.servings?`<span>${esc(r.servings)}人分</span>`:""}${r.favorite?`<span class="star">★ お気に入り</span>`:""}${r.sample?`<span class="sample">サンプル</span>`:""}</div>
        ${(r.tags||[]).length?`<div class="tags">${r.tags.slice(0,4).map(t=>`<span class="tag">${esc(t)}</span>`).join("")}</div>`:""}
      </div>
    </button>`).join("")}</div>`;
}
function updateResults(){const list=filtered();document.getElementById("results").innerHTML=listBody(list);document.getElementById("shown").textContent=S.recipes.length?list.length+"件を表示":""}
function backupNag(){
  if(!S.recipes.some(r=>!r.sample))return "";
  const last=+lsGet("lastBackup")||0,changed=Math.max(0,...S.recipes.map(r=>r.updatedAt||0));
  if(changed<=last)return "";
  if(last&&Date.now()-last<30*864e5)return "";
  return `<button class="banner" data-act="settings" style="border:none;text-align:left;width:100%">${last?"前回のバックアップから30日以上たっています。":"まだバックアップがありません。"}機種変更に備えて、ときどき書き出しておきましょう →</button>`;
}
function renderList(){
  const tags=allTags(),list=filtered();
  $app.innerHTML=`
    <header class="top">
      <div class="brand"><h1>さきのレシピ帖</h1><div style="display:flex;align-items:center;gap:6px"><span class="count">${S.recipes.length}品</span><button class="icon-btn" data-act="settings" aria-label="バックアップと設定">${gearIcon}</button></div></div>
      <div class="search">${searchIcon}<input id="q" type="search" placeholder="料理名・材料・タグで検索" value="${esc(S.q)}" autocomplete="off"></div>
      <div class="chips" role="group" aria-label="絞り込み">
        <button class="chip fav" data-fav aria-pressed="${S.fav}">★ お気に入り</button>
        ${tags.map(t=>`<button class="chip" data-tag="${esc(t)}" aria-pressed="${S.tag===t}">${esc(t)}</button>`).join("")}
      </div>
      <div class="row-tools"><span class="count" id="shown">${S.recipes.length?list.length+"件を表示":""}</span>
        <label><span class="count">並び順 </span><select id="sort" aria-label="並び順">
          <option value="new" ${S.sort==="new"?"selected":""}>新しい順</option>
          <option value="time" ${S.sort==="time"?"selected":""}>時短順</option>
          <option value="name" ${S.sort==="name"?"selected":""}>名前順</option>
        </select></label></div>
      ${backupNag()}
    </header>
    <div id="results">${listBody(list)}</div>

async function blobToDataURL(b){return await new Promise((ok,ng)=>{const r=new FileReader();r.onload=()=>ok(r.result);r.onerror=ng;r.readAsDataURL(b)})}
async function doExport(){
  S.bk={msg:"書き出しています…",err:""};render();
  try{
    const photos={};
    for(const r of S.recipes){if(r.photo){const b=await photoGet(r.photo);if(b)photos[r.photo]=await blobToDataURL(b)}}
    const data={app:"saki-recipe-book",version:1,exportedAt:new Date().toISOString(),recipes:S.recipes,photos};
    const d=new Date(),name=`recipe-backup-${d.getFullYear()}${String(d.getMonth()+1).padStart(2,"0")}${String(d.getDate()).padStart(2,"0")}.json`;
    const file=new File([JSON.stringify(data)],name,{type:"application/json"});
    let shared=false;
    if(navigator.canShare&&navigator.canShare({files:[file]})&&/iPhone|iPad|Android/i.test(navigator.userAgent)){
      try{await navigator.share({files:[file],title:"レシピのバックアップ"});shared=true}
      catch(e){if(e&&e.name==="AbortError"){S.bk={msg:"",err:""};return render()}}
    }
    if(!shared){const a=document.createElement("a");a.href=URL.createObjectURL(file);a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},2000)}
    lsSet("lastBackup",String(Date.now()));
    S.bk={msg:`${S.recipes.length}品を「${name}」に書き出しました。`,err:""};
  }catch(e){S.bk={msg:"",err:"書き出せませんでした。もう一度お試しください。"}}
  render();
}
async function doRestore(file){
  S.bk={msg:"読み込んでいます…",err:""};render();
  try{
    const data=JSON.parse(await file.text());
    if(!data||data.app!=="saki-recipe-book"||!Array.isArray(data.recipes))throw new Error("format");
    let n=0;
    for(const r of data.recipes){
      if(!r||!r.id||!r.title)continue;
      if(r.photo&&data.photos&&data.photos[r.photo]){const b=await (await fetch(data.photos[r.photo])).blob();await photoPut(r.photo,b);photoURLs.delete(r.photo)}
      await dbPut(r);n++;
    }
    await reload();
    S.bk={msg:`${n}品を読み込みました。`,err:""};
  }catch(e){S.bk={msg:"",err:"このファイルは読み込めませんでした。「バックアップを書き出す」で作ったファイルを選んでください。"}}
  render();
}

/* ---------- import from iPhone Shortcut ---------- */
const SHORTCUT_JS="(async()=>{try{\n/* ---------- recipe import from web pages ---------- */\nconst Z2H=s=>String(s||\"\").replace(/[０-９]/g,c=>String.fromCharCode(c.charCodeAt(0)-0xFEE0));\nconst clean=s=>String(s||\"\").replace(/&emsp;|&ensp;|&nbsp;/g,\" \").replace(/[\\u2003\\u2002\\u00a0\\u3000]/g,\" \").replace(/\\s+/g,\" \").trim();\nfunction numFrom(s){const m=Z2H(s).match(/(\\d+(?:\\.\\d+)?)/);return m?Number(m[1]):null}\nfunction isoMinutes(s){if(!s)return null;const m=String(s).match(/P(?:\\d+D)?T?(?:(\\d+)H)?(?:(\\d+)M)?/i);if(!m)return null;const v=(+m[1]||0)*60+(+m[2]||0);return v||null}\nfunction textOf(el){if(!el)return \"\";const c=el.cloneNode(true);c.querySelectorAll(\"script,style,img,ul.howto-imglist-col1\").forEach(x=>x.remove());return clean(c.textContent)}\nfunction splitIng(line){\n  let s=clean(line).replace(/^[・･\\-–]\\s*/,\"\").replace(/^[├└┣┗│]\\s*/,\"\");\n  const m=s.match(/^(.*?)\\s*(?:[：:]|…|\\.{3}|‥)\\s*(.*)$/);\n  let name=m?m[1]:s,amount=m?m[2]:\"\";\n  name=name.replace(/^[├└┣┗│]\\s*/,\"\").trim();\n  if(!m){const k=s.match(/^(.*?)[\\s　]+([^\\s　]+)$/);if(k){name=k[1];amount=k[2]}}\n  return {name:name.trim(),amount:amount.trim()};\n}\nfunction groupIngs(lines){\n  const out=[];let group=\"\";\n  for(const raw of lines){\n    const s=clean(raw),tree=/[├└┣┗]/.test(s),sub=tree||/^[・･]/.test(s);\n    const i=splitIng(s);if(!i.name)continue;\n    if(!sub&&(!i.amount||/^[（(][＊*※]?\\d*[）)]$/.test(i.amount))){group=i.name.replace(/^[★☆●■◆◎]\\s*/,\"\");out.push({name:`【${group}】`,amount:\"\"});continue}\n    if(!sub)group=\"\";\n    out.push({name:tree&&group&&group.length<=3?`(${group}) ${i.name}`:i.name,amount:i.amount});\n  }\n  return out;\n}\nfunction findJsonLdRecipe(doc){\n  const out=[];const walk=x=>{if(Array.isArray(x))x.forEach(walk);else if(x&&typeof x===\"object\"){if(x[\"@graph\"])walk(x[\"@graph\"]);out.push(x)}};\n  doc.querySelectorAll('script[type=\"application/ld+json\"]').forEach(s=>{try{walk(JSON.parse(s.textContent))}catch(e){}});\n  return out.find(x=>{const t=x[\"@type\"];return t===\"Recipe\"||(Array.isArray(t)&&t.includes(\"Recipe\"))})||null;\n}\nfunction stepsFromLd(ins){\n  const steps=[];\n  const walk=x=>{\n    if(!x)return;\n    if(typeof x===\"string\"){x.split(/\\n+/).map(clean).filter(Boolean).forEach(t=>steps.push(t));return}\n    if(Array.isArray(x)){x.forEach(walk);return}\n    if(x[\"@type\"]===\"HowToSection\"||x.itemListElement){walk(x.itemListElement);return}\n    if(x.text)steps.push(clean(x.text));else if(x.name)steps.push(clean(x.name));\n  };\n  walk(ins);\n  return steps.map(s=>s.replace(/^\\d+[\\.．、)]\\s*/,\"\"));\n}\nfunction fromJsonLd(r,doc){\n  const img=Array.isArray(r.image)?r.image[0]:r.image;\n  const imgUrl=typeof img===\"string\"?img:(img&&img.url)||null;\n  const yieldTxt=Array.isArray(r.recipeYield)?r.recipeYield.join(\" \"):r.recipeYield;\n  const kw=typeof r.keywords===\"string\"?r.keywords.split(/[,、]/):(r.keywords||[]);\n  const cat=[].concat(r.recipeCategory||[],r.recipeCuisine||[]);\n  return {\n    title:clean(r.name)||clean(doc.querySelector(\"h1\")&&doc.querySelector(\"h1\").textContent),\n    description:clean(r.description).slice(0,80),\n    minutes:isoMinutes(r.totalTime)||isoMinutes(r.cookTime)||null,\n    servings:numFrom(yieldTxt),\n    tags:[...cat,...kw].map(clean).filter(Boolean).slice(0,4),\n    ingredients:groupIngs([].concat(r.recipeIngredient||r.ingredients||[])),\n    steps:stepsFromLd(r.recipeInstructions),\n    memo:\"\",\n    image:imgUrl?String(imgUrl).trim():null\n  };\n}\nfunction fromSirogohan(doc){\n  const ttl=doc.querySelector(\".material-ttl\");\n  let title=ttl?clean(ttl.childNodes[0]&&ttl.childNodes[0].textContent).replace(/の材料$/,\"\"):\"\";\n  if(!title)title=clean(doc.querySelector(\"h1\")&&doc.querySelector(\"h1\").textContent).replace(/の?レシピ.*$/,\"\");\n  const servings=ttl?numFrom(ttl.querySelector(\"span\")&&ttl.querySelector(\"span\").textContent):null;\n  const ingredients=[];\n  doc.querySelectorAll(\"section.material ul\").forEach(ul=>{\n    const g=[...ul.classList].map(c=>c.match(/^([a-z])-list$/)).find(Boolean);\n    const prefix=g?`(${g[1].toUpperCase()}) `:\"\";\n    ul.querySelectorAll(\":scope > li\").forEach(li=>{const i=splitIng(li.textContent);if(i.name)ingredients.push({name:prefix+i.name,amount:i.amount})});\n  });\n  const steps=[],notes=[];\n  doc.querySelectorAll(\".howto-block\").forEach(b=>{\n    const h=b.querySelector(\".howto-ttl\");\n    if(!h||!/icon-num/.test(h.className))return;\n    b.querySelectorAll(\":scope > p\").forEach(p=>{\n      const t=textOf(p);if(!t)return;\n      if(p.classList.contains(\"note-text\")||/^[＊*※]/.test(t))notes.push(t.replace(/^[※＊*]\\s*/,\"※\"));else steps.push(t);\n    });\n  });\n  const desc=doc.querySelector('meta[name=\"description\"]');\n  const og=doc.querySelector('meta[property=\"og:image\"]');\n  const d0=desc?clean(desc.content):\"\";\n  return {title,description:/^白ごはん/.test(d0)?\"\":d0.slice(0,80),minutes:null,servings,tags:[],ingredients,steps,memo:notes.join(\"\\n\"),image:og?og.content:null};\n}\nconst SITE_PARSERS=[{host:/(^|\\.)sirogohan\\.com$/,parse:fromSirogohan}];\nfunction parseRecipeDoc(doc,url){\n  const host=new URL(url).hostname;\n  const site=SITE_PARSERS.find(p=>p.host.test(host));\n  let r=null;\n  if(site){try{r=site.parse(doc)}catch(e){r=null}}\n  if(!r||!r.ingredients.length){const ld=findJsonLdRecipe(doc);if(ld)r=fromJsonLd(ld,doc)}\n  if(!r||(!r.ingredients.length&&!r.steps.length))return null;\n  if(r.image){try{r.image=new URL(r.image,url).href}catch(e){r.image=null}}\n  return r;\n}\n\n\nconst r=parseRecipeDoc(document,location.href);\nif(!r){completion(\"ERROR:このページからレシピを見つけられませんでした。レシピ1品のページで試してください。\");return}\nlet photo=null;\nif(r.image){try{const bl=await (await fetch(r.image)).blob();const bm=await createImageBitmap(bl);const k=Math.min(1,800/Math.max(bm.width,bm.height));const c=document.createElement(\"canvas\");c.width=Math.round(bm.width*k);c.height=Math.round(bm.height*k);c.getContext(\"2d\").drawImage(bm,0,0,c.width,c.height);photo=c.toDataURL(\"image/jpeg\",0.72)}catch(e){}}\ncompletion(JSON.stringify({app:\"saki-recipe-import\",v:1,url:location.href,recipe:r,photo}));\n}catch(e){completion(\"ERROR:読み取り中にエラーが起きました（\"+e.message+\"）\")}})();\n";

        <p class="desc" style="font-size:.85rem">初めてのサイトで使うときは「アクセスを許可しますか？」と聞かれるので「許可」を選んでください。</p>
      </section>
    </div>`;
}
async function importPayload(text){
  const m=S.imp;m.err="";text=String(text||"").trim();
  if(!text){m.err="コピーされたレシピがありません。Safariの共有ボタンから「レシピ帖に追加」を押してから、もう一度お試しください。";return render()}
  if(text.startsWith("ERROR:")){m.err=text.slice(6);return render()}
  let d=null;try{d=JSON.parse(text)}catch(e){}
  if(!d||d.app!=="saki-recipe-import"||!d.recipe){
    m.err=/^https?:\/\//.test(text)?"URLがコピーされています。Safariでそのページを開き、共有ボタンから「レシピ帖に追加」を使ってください。":"レシピ帖のショートカットでコピーした内容ではないようです。";
    return render();
  }
  const r=d.recipe,arr=x=>Array.isArray(x)?x:[];
  let photo=null;if(typeof d.photo==="string"&&d.photo.startsWith("data:image/")){try{photo=await (await fetch(d.photo)).blob()}catch(e){}}
  const url=safeUrl(d.url)||"";const dup=url&&S.recipes.find(x=>x.sourceUrl===url);
  S.draft={title:String(r.title||""),description:String(r.description||""),minutes:Number(r.minutes)||"",servings:Number(r.servings)||"",
    tags:arr(r.tags).map(String).slice(0,6),ingredients:arr(r.ingredients).map(i=>({name:String(i&&i.name||""),amount:String(i&&i.amount||"")})).filter(i=>i.name),
    steps:arr(r.steps).map(String).filter(Boolean),memo:String(r.memo||""),sourceUrl:url,photo:null,imported:true,dupOf:dup?dup.title:null};
  S.err="";S.photoFile=photo;S.photoPreview=photo?URL.createObjectURL(photo):null;
  S.imp={err:""};S.view="edit";render();window.scrollTo(0,0);
}

/* ---------- actions ---------- */
function render(){({list:renderList,detail:renderDetail,edit:renderEdit,settings:renderSettings,import:renderImport}[S.view]||renderList)()}

function parseIng(text){return text.split("\n").map(l=>l.trim()).filter(Boolean).map(l=>{const m=l.match(/^(.*?)[\s　]+([^\s　]+)$/);return m?{name:m[1].trim(),amount:m[2]}:{name:l,amount:""}})}
async function resizeImage(file){
  const img=await new Promise((ok,ng)=>{const i=new Image();i.onload=()=>ok(i);i.onerror=ng;i.src=URL.createObjectURL(file)});
  const max=1400,s=Math.min(1,max/Math.max(img.width,img.height));
  const c=document.createElement("canvas");c.width=Math.round(img.width*s);c.height=Math.round(img.height*s);
  c.getContext("2d").drawImage(img,0,0,c.width,c.height);
  return await new Promise(ok=>c.toBlob(ok,"image/jpeg",.84));
}
function readForm(){
  const f=document.getElementById("f");if(!f)return;const g=n=>f.elements[n].value;
  Object.assign(S.draft,{title:g("title"),description:g("description"),minutes:g("minutes"),servings:g("servings"),
    tags:g("tags").split(/[、,，\s　]+/).map(t=>t.trim()).filter(Boolean),ingredients:parseIng(g("ingredients")),
    steps:g("steps").split("\n").map(s=>s.trim()).filter(Boolean),memo:g("memo"),sourceUrl:g("sourceUrl")});
}
async function save(){
  readForm();const d=S.draft;
  if(!d.title.trim()){S.err="料理名を入力してください。";return render()}
  S.saving=true;S.err="";render();
  try{
    const old=d.id?S.recipes.find(x=>x.id===d.id):null;
    if(S.photoFile){
      const blob=await resizeImage(S.photoFile),pid="p"+uid();
      await photoPut(pid,blob);photoURLs.set(pid,URL.createObjectURL(blob));d.photo=pid;
    }
    if(old&&old.photo&&old.photo!==d.photo){photoDel(old.photo).catch(()=>{})}
    const now=Date.now();
    const rec={id:d.id||uid(),title:d.title.trim(),description:(d.description||"").trim(),minutes:Number(d.minutes)||null,servings:Number(d.servings)||null,
      tags:d.tags,ingredients:d.ingredients,steps:d.steps,memo:(d.memo||"").trim(),sourceUrl:safeUrl(d.sourceUrl)||null,photo:d.photo||null,
      favorite:!!d.favorite,createdAt:d.createdAt||now,updatedAt:now,sample:false};
    await dbPut(rec);await reload();
    S.id=rec.id;S.view="detail";S.draft=null;S.photoFile=null;S.photoPreview=null;S.saving=false;
    toast("保存しました");render();window.scrollTo(0,0);
  }catch(e){S.saving=false;S.err=e&&e.name==="QuotaExceededError"?"スマホの空き容量が足りません。":"保存できませんでした。もう一度お試しください。";render()}
}
async function setWake(on){try{if(on&&"wakeLock" in navigator){wake=await navigator.wakeLock.request("screen")}else if(wake){await wake.release();wake=null}}catch(e){}}

$app.addEventListener("click",async e=>{
  const t=e.target.closest("[data-act],[data-open],[data-tag],[data-fav],[data-step]");if(!t)return;
  if(t.dataset.open){S.id=t.dataset.open;S.view="detail";S.confirmDel=false;S.cooking=false;S.cur=0;render();window.scrollTo(0,0);return}
  if(t.dataset.tag!==undefined){S.tag=S.tag===t.dataset.tag?null:t.dataset.tag;render();return}
  if(t.hasAttribute("data-fav")){S.fav=!S.fav;render();return}
  if(t.dataset.step!==undefined){if(S.cooking){S.cur=+t.dataset.step;render()}return}
  const a=t.dataset.act,r=S.recipes.find(x=>x.id===S.id);
  if(a==="new"){S.draft={title:"",description:"",minutes:"",servings:"",tags:[],ingredients:[],steps:[],memo:"",photo:null,sourceUrl:""};S.err="";S.photoFile=null;S.photoPreview=null;S.view="edit";render();window.scrollTo(0,0)}
  else if(a==="clear"){S.q="";S.tag=null;S.fav=false;render()}
  else if(a==="back"){S.view="list";setWake(false);S.cooking=false;render()}
  else if(a==="settings"){S.bk={msg:"",err:""};S.view="settings";render();window.scrollTo(0,0)}
  else if(a==="edit"&&r){S.draft=JSON.parse(JSON.stringify(r));S.err="";S.photoFile=null;S.photoPreview=null;S.view="edit";setWake(false);S.cooking=false;render();window.scrollTo(0,0)}
  else if(a==="cancel"){S.view=S.draft&&S.draft.id?"detail":"list";S.draft=null;S.photoFile=null;S.photoPreview=null;render()}
  else if(a==="fav"&&r){await dbPut({...r,favorite:!r.favorite});await reload();toast(r.favorite?"お気に入りから外しました":"お気に入りに追加しました");render()}
  else if(a==="cook"){S.cooking=!S.cooking;S.cur=0;setWake(S.cooking);render()}
  else if(a==="del"){S.confirmDel=true;render()}
  else if(a==="del-no"){S.confirmDel=false;render()}
  else if(a==="del-yes"&&r){await dbDel(r.id);if(r.photo)photoDel(r.photo).catch(()=>{});await reload();S.view="list";S.confirmDel=false;toast("削除しました");render()}
  else if(a==="pick"){readForm();document.getElementById("f-photo").click()}
  else if(a==="nophoto"){readForm();S.draft.photo=null;S.photoFile=null;S.photoPreview=null;render()}
  else if(a==="export"){doExport()}
  else if(a==="import"){S.imp={err:""};S.view="import";render();window.scrollTo(0,0)}
  else if(a==="imp-close"){S.view="list";render()}
  else if(a==="imp-clip"){let t="";try{t=await navigator.clipboard.readText()}catch(e){S.imp.err="クリップボードを読めませんでした。下の欄に貼り付けて「追加」を押してください。";S.imp.fallback=true;return render()}importPayload(t)}
  else if(a==="imp-text"){const v=document.getElementById("imp-text").value;S.imp.fallback=true;S.imp.text=v.length<2000?v:"";importPayload(v)}
  else if(a==="copy-code"){try{await navigator.clipboard.writeText(SHORTCUT_JS);toast("コードをコピーしました")}catch(e){const ta=document.getElementById("sc-code");ta.closest("details").open=true;ta.focus();ta.select();toast("表示されたコードを全部選んでコピーしてください")}}
  else if(a==="restore"){document.getElementById("restore-file").click()}
});
$app.addEventListener("change",e=>{
  if(e.target.id==="sort"){S.sort=e.target.value;lsSet("sort",S.sort);render()}
  if(e.target.id==="f-photo"&&e.target.files[0]){readForm();S.photoFile=e.target.files[0];S.photoPreview=URL.createObjectURL(S.photoFile);render()}
  if(e.target.id==="restore-file"&&e.target.files[0]){doRestore(e.target.files[0])}
  if(e.target.dataset.chk!==undefined){const m=S.checked[S.id]||(S.checked[S.id]={});m[e.target.dataset.chk]=e.target.checked;e.target.closest("li").classList.toggle("done",e.target.checked)}
});
$app.addEventListener("input",e=>{if(e.target.id==="q"){S.q=e.target.value;if(!e.isComposing)updateResults()}});
$app.addEventListener("compositionend",e=>{if(e.target.id==="q"){S.q=e.target.value;updateResults()}});
$app.addEventListener("submit",e=>{e.preventDefault();save()});
document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible"&&S.cooking)setWake(true)});
